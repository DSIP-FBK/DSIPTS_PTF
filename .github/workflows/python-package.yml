name: Python Package

on:
  push:
    branches:
      - '**'  # Match all branches including those with slashes
  pull_request:
    branches: 
      - main
      - master  # Include master branch as well

jobs:
  # lint:
  #   # Ruff checks are commented out for now. Uncomment to restore linting/formatting checks.
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v3
  #   - name: Set up Python
  #     uses: actions/setup-python@v4
  #     with:
  #       python-version: '3.10'
  #   - name: Install dependencies
  #     run: |
  #       python -m pip install --upgrade pip
  #       pip install ruff
  #   - name: Run Ruff
  #     run: |
  #       ruff check .
  #       ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        # Create a virtual environment for uv
        uv venv
        # Install PyTorch first to avoid conflicts
        uv pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Install all dependencies from requirements.txt
        uv pip install -r requirements.txt
        # Install package in development mode
        uv pip install -e .
        # Explicitly install pytest and pytest-cov in the virtual environment
        uv pip install pytest pytest-cov
    - name: Run tests
      run: |
        # Use the Python from the virtual environment
        source .venv/bin/activate
        # Only run unit tests for now, integration tests will be handled in a separate MR
        #python -m pytest tests --cov=dsipts --cov-report=xml
        python -m pytest tests/unit/ --cov=dsipts --cov-report=xml
  docs:
    needs: test
    runs-on: ubuntu-latest
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install package with docs extras
        pip install -e ".[docs]"
        # Ensure myst-parser is installed for modern Markdown support
        pip install myst-parser>=4.0.0
    - name: Generate API documentation
      run: |
        sphinx-apidoc -f -o docs/ dsipts/ \
          --separate \
          --module-first \
          --no-toc \
          -M \
          --implicit-namespaces
    - name: Build documentation
      run: |
        cd docs
        make clean
        make html
        cd ..
        # Debug - check if the build was successful
        echo "Checking if HTML files were generated:"
        ls -la docs/_build/html/
        echo "Does index.html exist?"
        test -f docs/_build/html/index.html && echo "Yes" || echo "No"
    # Note: Deployment to GitHub Pages is handled by .github/workflows/docs.yml
  build:
    needs: [test, docs]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools wheel
    - name: Build package
      run: |
        # Create a requirements.txt file if it doesn't exist
        if [ ! -f requirements.txt ]; then
          echo "Creating requirements.txt from setup.py core_requirements"
          python -c "import re; from setup import core_requirements; print('\n'.join(core_requirements))" > requirements.txt
        fi
        # Build the package
        python -m build
    - name: Check package
      run: twine check dist/*
