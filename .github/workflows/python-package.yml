name: Python Package

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  # lint:
  #   # Ruff checks are commented out for now. Uncomment to restore linting/formatting checks.
  #   runs-on: ubuntu-latest
  #   steps:
