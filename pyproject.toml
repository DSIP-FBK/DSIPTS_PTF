[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsipts"
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
docs = [
    # Sphinx packages
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=4.0.0",
    "sphinx_pdj_theme>=0.4.0",
    # Core dependencies for autodoc imports
    "numpy>=1.24.0",
    "aim>=3.29.1",
    "torch>=2.0.0,<2.7.0",
    "scipy>=1.10.0",
    "pytorch-lightning==1.9.4",
    "pandas>=2.0.0",
    "torchmetrics>=0.11.0",
    "lightning_utilities>=0.8.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "hydra-optuna-sweeper>=1.2.0",
    "scikit-learn>=1.2.0",
    "numba>=0.57.0",
    "einops>=0.6.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
    "starlette>=0.30.0,<0.47.0",
    "pydantic>=1.10.0,<3.0.0",
    "plotly>=5.14.0",
    "beautifulsoup4==4.13.4",
    "html5lib>=1.1",
    "html-table-parser-python3==0.3.1",
]

[tool.ruff]
select = ["E", "F", "I"]
ignore = []
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# By default, don't run integration tests
testpaths = ["tests/unit"]
# Add markers for different test types
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]
